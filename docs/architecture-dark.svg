<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 468" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="OpenGATE architecture: systems under test connect through a one-file adapter to the deterministic core — gold datasets and system answers feed pure-logic scorers, which produce versioned scorecards; a regression gate compares each scorecard to the baseline on every commit — improved or held deploys, regressed fails the build.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#767d86"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker></defs>
<rect x="16" y="52" width="230" height="396" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="34" y="78" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9198a1">SYSTEMS UNDER TEST</text>
<rect x="36.0" y="100" width="190" height="48" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="131" y="122" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">RefCheckr</text>
<text x="131" y="140" font-size="11" text-anchor="middle" fill="#9198a1">QA &#183; citations</text>
<rect x="36.0" y="170" width="190" height="48" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="131" y="192" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Redacta</text>
<text x="131" y="210" font-size="11" text-anchor="middle" fill="#9198a1">redaction</text>
<rect x="36.0" y="240" width="190" height="48" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="131" y="262" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Patiently AI</text>
<text x="131" y="280" font-size="11" text-anchor="middle" fill="#9198a1">simplification</text>
<rect x="36.0" y="310" width="190" height="48" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="131" y="332" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">PubCrawl</text>
<text x="131" y="350" font-size="11" text-anchor="middle" fill="#9198a1">retrieval</text>
<rect x="36.0" y="380" width="190" height="48" rx="8" fill="#212830" stroke="#3d444d" stroke-dasharray="5 4"/>
<text x="131" y="402" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Your system</text>
<text x="131" y="420" font-size="11" text-anchor="middle" fill="#9198a1">one adapter file</text>
<polyline points="226,124 244,124 244,404 226,404" fill="none" stroke="#767d86" stroke-width="1.5"/>
<line x1="226" y1="194" x2="244" y2="194" stroke="#767d86" stroke-width="1.5"/>
<line x1="226" y1="264" x2="244" y2="264" stroke="#767d86" stroke-width="1.5"/>
<line x1="226" y1="334" x2="244" y2="334" stroke="#767d86" stroke-width="1.5"/>
<polyline points="244,264 253,264" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="253.0" y="240" width="76" height="48" rx="8" fill="#212830" stroke="#3d444d" stroke-dasharray="5 4"/>
<text x="291" y="268.5" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">adapter</text>
<text x="291" y="304" font-size="11" text-anchor="middle" fill="#9198a1">answers</text>
<polyline points="329,264 348,264 348,208 364,208" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="336" y="52" width="330" height="396" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="354" y="78" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9198a1">OPENGATE CORE &#183; NO LLM JUDGE</text>
<rect x="366.0" y="92" width="270" height="52" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="501" y="114" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Gold datasets</text>
<text x="501" y="132" font-size="11" text-anchor="middle" fill="#9198a1">hand-labelled expected outcomes</text>
<polyline points="501,144 501,178" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="511" y="165" font-size="11" fill="#9198a1">expected</text>
<rect x="366.0" y="180" width="270" height="56" rx="8" fill="#2a2139" stroke="#ab7df8"/>
<text x="501" y="202" font-size="13" font-weight="600" text-anchor="middle" fill="#ab7df8">Deterministic scorers</text>
<text x="501" y="220" font-size="11" text-anchor="middle" fill="#9198a1">pure logic &#183; one per metric family</text>
<polyline points="501,236 501,270" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="366.0" y="272" width="270" height="52" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="501" y="294" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Scorecards</text>
<text x="501" y="312" font-size="11" text-anchor="middle" fill="#9198a1">versioned JSON + HTML</text>
<text x="354" y="430" font-size="11" font-style="italic" fill="#9198a1">reproducible &#183; free &#183; fast enough for every answer</text>
<polyline points="636,298 672,298 672,148 718,148" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="696" y="52" width="248" height="396" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="714" y="78" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9198a1">THE GATE &#183; EVERY COMMIT</text>
<rect x="720.0" y="120" width="200" height="56" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="820" y="142" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Regression gate</text>
<text x="820" y="160" font-size="11" text-anchor="middle" fill="#9198a1">this scorecard vs baseline</text>
<polyline points="768,176 768,250" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="758" y="216" font-size="11" font-weight="600" fill="#3fb950" text-anchor="end">improved / held</text>
<rect x="705.0" y="254" width="140" height="44" rx="8" fill="#122117" stroke="#2b5233"/>
<text x="775" y="280.5" font-size="13" font-weight="600" text-anchor="middle" fill="#3fb950">Deploy</text>
<polyline points="872,176 872,340" fill="none" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr-red)"/>
<text x="882" y="216" font-size="11" font-weight="600" fill="#f85149" text-anchor="start">regressed</text>
<rect x="765.0" y="344" width="160" height="48" rx="8" fill="#3c1618" stroke="#6e2a2c"/>
<text x="845" y="366" font-size="13" font-weight="600" text-anchor="middle" fill="#f85149">Build fails</text>
<text x="845" y="384" font-size="11" text-anchor="middle" fill="#9198a1">investigate the diff</text>
</svg>